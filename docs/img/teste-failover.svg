<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="Manrope, Liberation Sans, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B4FE0"/>
    </marker>
  </defs>
  <rect width="1400" height="560" fill="#ffffff"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#141420" font-family="Sora, Liberation Sans, Arial, sans-serif">Teste de failover: o que muda em cada etapa</text>
  <text x="40" y="80" font-size="17" fill="#6B6B85">Valores ilustrativos (IPs públicos de documentação, RFC 5737)</text>

  <!-- Etapa 1 -->
  <g>
    <rect x="40" y="110" width="400" height="330" rx="16" fill="#F4F2FF" stroke="#5B4FE0" stroke-width="2"/>
    <text x="64" y="150" font-size="15" font-weight="700" fill="#5B4FE0" letter-spacing="1.5">1 · OPERAÇÃO NORMAL</text>
    <text x="64" y="186" font-size="22" font-weight="700" fill="#141420" font-family="Sora, Liberation Sans, Arial, sans-serif">Saída pela Operadora A</text>
    <rect x="64" y="210" width="352" height="44" rx="8" fill="#fff" stroke="#DCD9F2"/>
    <text x="80" y="238" font-size="17" fill="#141420" font-family="DejaVu Sans Mono, Courier New, monospace">OPA-DEFAULT</text>
    <rect x="330" y="219" width="72" height="26" rx="6" fill="#1D7A4F"/><text x="366" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">ativa</text>
    <rect x="64" y="264" width="352" height="44" rx="8" fill="#fff" stroke="#DCD9F2"/>
    <text x="80" y="292" font-size="17" fill="#141420" font-family="DejaVu Sans Mono, Courier New, monospace">OPB-DEFAULT</text>
    <rect x="316" y="273" width="86" height="26" rx="6" fill="#A2A2B8"/><text x="359" y="292" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">espera</text>
    <text x="64" y="346" font-size="16" fill="#4A4A63">IP público</text>
    <text x="64" y="378" font-size="22" font-weight="700" fill="#2E2699" font-family="DejaVu Sans Mono, Courier New, monospace">203.0.113.10</text>
    <text x="64" y="414" font-size="16" fill="#4A4A63">netwatch OPA-MON: up</text>
  </g>

  <!-- Etapa 2 -->
  <g>
    <rect x="500" y="110" width="400" height="330" rx="16" fill="#FDF6E8" stroke="#C48A1A" stroke-width="2"/>
    <text x="524" y="150" font-size="15" font-weight="700" fill="#A66F0A" letter-spacing="1.5">2 · OPERADORA A "CAI" (SIMULAÇÃO)</text>
    <text x="524" y="186" font-size="22" font-weight="700" fill="#141420" font-family="Sora, Liberation Sans, Arial, sans-serif">Operadora B assume sozinha</text>
    <rect x="524" y="210" width="352" height="44" rx="8" fill="#fff" stroke="#EADBC0"/>
    <text x="540" y="238" font-size="17" fill="#141420" font-family="DejaVu Sans Mono, Courier New, monospace">OPA-DEFAULT</text>
    <rect x="766" y="219" width="96" height="26" rx="6" fill="#C0392B"/><text x="814" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">desativada</text>
    <rect x="524" y="264" width="352" height="44" rx="8" fill="#fff" stroke="#EADBC0"/>
    <text x="540" y="292" font-size="17" fill="#141420" font-family="DejaVu Sans Mono, Courier New, monospace">OPB-DEFAULT</text>
    <rect x="790" y="273" width="72" height="26" rx="6" fill="#1D7A4F"/><text x="826" y="292" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">ativa</text>
    <text x="524" y="346" font-size="16" fill="#4A4A63">IP público</text>
    <text x="524" y="378" font-size="22" font-weight="700" fill="#A66F0A" font-family="DejaVu Sans Mono, Courier New, monospace">198.51.100.20</text>
    <text x="524" y="414" font-size="16" fill="#4A4A63">host de teste da Operadora A bloqueado</text>
  </g>

  <!-- Etapa 3 -->
  <g>
    <rect x="960" y="110" width="400" height="330" rx="16" fill="#F4F2FF" stroke="#5B4FE0" stroke-width="2"/>
    <text x="984" y="150" font-size="15" font-weight="700" fill="#5B4FE0" letter-spacing="1.5">3 · SIMULAÇÃO DESFEITA</text>
    <text x="984" y="186" font-size="22" font-weight="700" fill="#141420" font-family="Sora, Liberation Sans, Arial, sans-serif">Volta para a Operadora A</text>
    <rect x="984" y="210" width="352" height="44" rx="8" fill="#fff" stroke="#DCD9F2"/>
    <text x="1000" y="238" font-size="17" fill="#141420" font-family="DejaVu Sans Mono, Courier New, monospace">OPA-DEFAULT</text>
    <rect x="1250" y="219" width="72" height="26" rx="6" fill="#1D7A4F"/><text x="1286" y="238" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">ativa</text>
    <rect x="984" y="264" width="352" height="44" rx="8" fill="#fff" stroke="#DCD9F2"/>
    <text x="1000" y="292" font-size="17" fill="#141420" font-family="DejaVu Sans Mono, Courier New, monospace">OPB-DEFAULT</text>
    <rect x="1236" y="273" width="86" height="26" rx="6" fill="#A2A2B8"/><text x="1279" y="292" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">espera</text>
    <text x="984" y="346" font-size="16" fill="#4A4A63">IP público</text>
    <text x="984" y="378" font-size="22" font-weight="700" fill="#2E2699" font-family="DejaVu Sans Mono, Courier New, monospace">203.0.113.10</text>
    <text x="984" y="414" font-size="16" fill="#4A4A63">em ~30 s, sem intervenção</text>
  </g>

  <line x1="444" y1="275" x2="494" y2="275" stroke="#5B4FE0" stroke-width="3" marker-end="url(#a)"/>
  <line x1="904" y1="275" x2="954" y2="275" stroke="#5B4FE0" stroke-width="3" marker-end="url(#a)"/>

  <rect x="40" y="470" width="1320" height="60" rx="12" fill="#FAF9FF" stroke="#DCD9F2"/>
  <text x="64" y="497" font-size="17" fill="#141420"><tspan font-weight="700">Como a simulação funciona:</tspan> uma regra de firewall bloqueia o host de teste da Operadora A (208.67.222.222).</text><text x="64" y="520" font-size="17" fill="#141420">A rota recursiva e o netwatch detectam a "queda" e trocam de operadora; ao remover a regra, tudo volta sozinho.</text>
</svg>
